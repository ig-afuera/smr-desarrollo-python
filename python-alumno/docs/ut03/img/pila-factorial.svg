<svg xmlns="http://www.w3.org/2000/svg" width="600" height="356" viewBox="0 0 600 356"><defs><marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="flecha-verde" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="6"/><text x="190.0" y="24.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">Llamadas (se apilan)</text><text x="470.0" y="24.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#15803d">Retornos (se desapilan)</text><rect x="60.0" y="40.0" width="320.0" height="44.0" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="220.0" y="67.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">print(factorial(3))</text><rect x="60.0" y="120.0" width="320.0" height="44.0" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="220.0" y="147.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">factorial(3) → 3 * factorial(2)</text><rect x="60.0" y="200.0" width="320.0" height="44.0" rx="6" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="220.0" y="227.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">factorial(2) → 2 * factorial(1)</text><rect x="60.0" y="280.0" width="320.0" height="44.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="220.0" y="307.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">factorial(1) → caso base: 1</text><path d="M120.0,84.0 L120.0,120.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><text x="112.0" y="106.0" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">llama</text><path d="M120.0,164.0 L120.0,200.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><text x="112.0" y="186.0" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">llama</text><path d="M120.0,244.0 L120.0,280.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><text x="112.0" y="266.0" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">llama</text><path d="M330.0,280.0 L330.0,244.0" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#flecha-verde)"/><text x="392.0" y="266.0" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#15803d">devuelve 1</text><path d="M330.0,200.0 L330.0,164.0" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#flecha-verde)"/><text x="392.0" y="186.0" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#15803d">devuelve 2 * 1 = 2</text><path d="M330.0,120.0 L330.0,84.0" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#flecha-verde)"/><text x="392.0" y="106.0" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#15803d">devuelve 3 * 2 = 6</text></svg>
