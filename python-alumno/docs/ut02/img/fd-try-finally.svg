<svg xmlns="http://www.w3.org/2000/svg" width="624" height="466" viewBox="0 0 624 466"><defs><marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="6"/><rect x="250.0" y="14.0" width="92.0" height="36.0" rx="18.0" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="296.0" y="37.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">Inicio</text><path d="M296.0,50.0 L296.0,76.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="158.0,76.0 446.0,76.0 434.0,112.0 146.0,112.0" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="296.0" y="99.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">numero = int(input("Número: "))</text><path d="M296.0,112.0 L296.0,138.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="296.0,138.0 382.6,176.0 296.0,214.0 209.4,176.0" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="296.0" y="172.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">¿int() lanza</text><text x="296.0" y="190.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">ValueError?</text><text x="203.4" y="169.0" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">Sí</text><path d="M209.4,176.0 L156.0,176.0 L156.0,236.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="46.0,236.0 278.0,236.0 266.0,290.0 34.0,290.0" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="156.0" y="259.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">except ValueError:</text><text x="156.0" y="277.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">print("No es un número")</text><path d="M156.0,290.0 L156.0,310.0 L296.0,310.0" fill="none" stroke="#334155" stroke-width="1.6"/><text x="388.6" y="169.0" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">No</text><path d="M382.6,176.0 L452.0,176.0 L452.0,236.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="326.0,236.0 590.0,236.0 578.0,272.0 314.0,272.0" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="452.0" y="259.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">print("Has escrito", numero)</text><path d="M452.0,272.0 L452.0,310.0 L296.0,310.0" fill="none" stroke="#334155" stroke-width="1.6"/><path d="M296.0,310.0 L296.0,336.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="186.0,336.0 418.0,336.0 406.0,390.0 174.0,390.0" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="296.0" y="359.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">finally:</text><text x="296.0" y="377.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">print("Fin del intento")</text><path d="M296.0,390.0 L296.0,416.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="262.0" y="416.0" width="6