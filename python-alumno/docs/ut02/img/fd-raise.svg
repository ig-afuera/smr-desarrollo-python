<svg xmlns="http://www.w3.org/2000/svg" width="504" height="492" viewBox="0 0 504 492"><defs><marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="6"/><rect x="290.0" y="14.0" width="92.0" height="36.0" rx="18.0" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="336.0" y="37.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">Inicio</text><path d="M336.0,50.0 L336.0,76.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="214.0,76.0 470.0,76.0 458.0,112.0 202.0,112.0" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="336.0" y="99.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">edad = int(input("Edad: "))</text><path d="M336.0,112.0 L336.0,138.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="336.0,138.0 411.0,167.0 336.0,196.0 261.0,167.0" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/><text x="336.0" y="172.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">¿edad &lt; 0?</text><text x="255.0" y="160.0" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">Sí</text><path d="M261.0,167.0 L176.0,167.0 L176.0,218.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="34.0" y="218.0" width="284.0" height="54.0" fill="#ffffff" stroke="#334155" stroke-width="1.6"/><text x="176.0" y="241.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">raise ValueError(</text><text x="176.0" y="259.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">"La edad no puede ser negativa")</text><path d="M176.0,272.0 L176.0,298.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="102.0" y="298.0" width="148.0" height="36.0" rx="18.0" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="176.0" y="321.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">Fin con error</text><text x="417.0" y="160.0" text-anchor="start" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#475569">No</text><path d="M411.0,167.0 L411.0,167.0 L411.0,354.0 L336.0,354.0" fill="none" stroke="#334155" stroke-width="1.6"/><path d="M336.0,354.0 L336.0,380.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><polygon points="214.0,380.0 470.0,380.0 458.0,416.0 202.0,416.0" fill="#fef3c7" stroke="#334155" stroke-width="1.6"/><text x="336.0" y="403.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="normal" fill="#0f172a">print("Edad válida:", edad)</text><path d="M336.0,416.0 L336.0,442.0" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="302.0" y="442.0" width="68.0" height="36.0" rx="18.0" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/><text x="336.0" y="465.0" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="bold" fill="#0f172a">Fin</text></svg>
